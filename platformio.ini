; PlatformIO project configuration for ESP32-DIV
;
; Initial build config only: third-party libraries are intentionally not
; configured yet. The sketch currently lives in ESP32-DIV/ and the repo ships
; only TFT_eSPI + SmartRC-CC1101 as ZIPs under Libraries/.
;
; Board selection itself is compiled in via ESP32-DIV/BoardConfig.h
; (BOARD_ESP32_DIV_V2 by default), so this env targets the v2 hardware.

[platformio]
default_envs = esp32-div-v2
src_dir = ESP32-DIV

; Uncomment once the bundled libraries are extracted into Libraries/:
; lib_extra_dirs = Libraries

[env:esp32-div-v2]
; Upstream pins Arduino-ESP32 2.0.10, which PlatformIO never packaged.
; 6.4.0 is the closest available (Arduino-ESP32 2.0.11); do not float this,
; because Arduino-ESP32 3.x drops the legacy esp_event_loop.h used here.
platform = espressif32@6.4.0
board = esp32-s3-devkitc-1
framework = arduino

; 16 MB flash, OPI PSRAM (matches the v2 board / Arduino IDE settings).
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.flash_freq = 80m
board_build.arduino.memory_type = qio_opi

; Upstream uses "Minimal SPIFFS". The app partition there is only ~1.9 MB,
; which is close to the current firmware size; switch to default_16MB.csv
; (3 MB app) if the build overflows.
board_build.partitions = min_spiffs.csv

; Upload / serial monitor.
board_upload.flash_size = 16MB
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Upstream build suppresses warnings via its custom platform.txt; keep parity.
; BOARD_HAS_PSRAM enables the Arduino core's PSRAM init on the v2 board
; (PlatformIO's DevKitC-1 board definition is the "no PSRAM" variant).
build_flags =
    -w
    -DBOARD_HAS_PSRAM

; Third-party libraries (TFT_eSPI, PCF8574, NimBLE-Arduino, RCSwitch,
; arduinoFFT, ArduinoJson, IRremoteESP8266, Adafruit_PN532, RF24, ...) still
; need to be added here or dropped into lib/ before a real build.
; lib_deps =
