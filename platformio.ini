; PlatformIO project configuration for ESP32-DIV
;
; Libraries are pinned to the versions listed in the upstream
; Libraries/README.txt. The two bundled ZIPs (TFT_eSPI, SmartRC-CC1101) are
; extracted into Libraries/ because TFT_eSPI's User_Setup.h is board-specific.
;
; Board selection itself is compiled in via ESP32-DIV/BoardConfig.h
; (BOARD_ESP32_DIV_V2 by default), so this env targets the v2 hardware.

[platformio]
default_envs = esp32-div-v2
src_dir = ESP32-DIV

[env:esp32-div-v2]
; Upstream pins Arduino-ESP32 2.0.10, which PlatformIO never packaged.
; 6.4.0 is the closest available (Arduino-ESP32 2.0.11); do not float this,
; because Arduino-ESP32 3.x drops the legacy esp_event_loop.h used here.
platform = espressif32@6.4.0
board = esp32-s3-devkitc-1
framework = arduino

; 16 MB flash, OPI PSRAM (matches the v2 board / Arduino IDE settings).
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.flash_freq = 80m
board_build.arduino.memory_type = qio_opi

; Use the full 16 MB flash: two ~6.25 MB OTA app slots instead of the ~1.9 MB
; slots in upstream's "Minimal SPIFFS" (4 MB) layout.
board_build.partitions = default_16MB.csv

; Upload / serial monitor.
board_upload.flash_size = 16MB
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Upstream build suppresses warnings via its custom platform.txt; keep parity.
; BOARD_HAS_PSRAM enables the Arduino core's PSRAM init on the v2 board
; (PlatformIO's DevKitC-1 board definition is the "no PSRAM" variant).
; --allow-multiple-definition is needed because wifi.cpp provides its own
; ieee80211_raw_frame_sanity_check(), which core 2.0.11 also exports.
build_flags =
    -w
    -DBOARD_HAS_PSRAM
    -Wl,--allow-multiple-definition

; Third-party libraries. Versions come from the dependency list in the
; upstream Libraries/README.txt (dev branch). TFT_eSPI and SmartRC-CC1101 are
; the bundled ZIPs, extracted in place because TFT_eSPI's User_Setup.h is
; board-specific. SmartRC's library.json also renames its global `spi` flag so
; it does not collide with TFT_eSPI's global SPIClass `spi`.
lib_deps =
    file://Libraries/TFT_eSPI-master
    file://Libraries/SmartRC-CC1101-Driver-Lib-master
    nrf24/RF24@1.4.11
    crankyoldgit/IRremoteESP8266@2.8.6
    h2zero/NimBLE-Arduino@1.4.3
    adafruit/Adafruit PN532@1.3.4
    sui77/rc-switch@2.6.4
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
    bblanchon/ArduinoJson@7.2.0
    xreef/PCF8574 library@2.4.0
    kosme/arduinoFFT@1.6.1
    adafruit/Adafruit NeoPixel@1.12.2
    adafruit/Adafruit BusIO@1.17.4
